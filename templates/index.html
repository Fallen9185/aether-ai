<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AETHER | Космический ИИ-ассистент</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.ico?v=2">
    <style>
        :root { --bg: linear-gradient(160deg, #03040b 0%, #0b0f29 50%, #150a28 100%); --glass: rgba(15, 19, 42, 0.78); --border: rgba(139, 92, 246, 0.32); --text: #f8fafc; --muted: #94a3b8; --grad: linear-gradient(135deg, #6366f1 0%, #ec4899 50%, #06b6d4 100%); }
        html.light, body.light { --bg: linear-gradient(180deg, #38bdf8 0%, #7dd3fc 52%, #e0f2fe 100%); --glass: rgba(255, 255, 255, 0.8); --border: rgba(2, 132, 199, 0.3); --text: #0f172a; --muted: #0369a1; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100dvh; overflow: hidden; position: relative; transition: background 0.4s, color 0.4s; }
        #spaceCanvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
        .nebula { position: fixed; width: 440px; height: 440px; border-radius: 50%; filter: blur(95px); opacity: 0.34; z-index: 0; pointer-events: none; animation: drift 14s infinite alternate ease-in-out; }
        .n1 { background: #8b5cf6; top: -100px; left: -80px; }
        .n2 { background: #06b6d4; bottom: -120px; right: -80px; animation-delay: -5s; }
        .n3 { background: #ec4899; top: 35%; left: 45%; width: 320px; height: 320px; opacity: 0.2; animation-delay: -9s; }
        body.light .nebula { opacity: 0; display: none; }
        @keyframes drift { from { transform: translate(0, 0) scale(1); } to { transform: translate(35px, 25px) scale(1.15); } }
        .header, .messages, .bottom-bar, .modal-bg, .menu-panel { position: relative; z-index: 2; }
        .header { background: var(--glass); backdrop-filter: blur(18px); padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; z-index: 20; }
        .brand-wrap { display: flex; align-items: center; gap: 8px; position: relative; }
        .brand-wrap::before { content: ""; position: absolute; left: -6px; width: 26px; height: 26px; border: 2px solid transparent; border-top-color: #ec4899; border-bottom-color: #06b6d4; border-radius: 50%; animation: spin 4s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .brand { font-size: 20px; font-weight: 900; letter-spacing: 2px; background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .stat-badge { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.4); color: #10b981; }
        body.light .stat-badge { color: #047857; background: rgba(16, 185, 129, 0.22); }
        .controls { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
        .pill-btn { background: rgba(139, 92, 246, 0.16); color: var(--text); border: 1px solid var(--border); padding: 7px 12px; border-radius: 999px; cursor: pointer; font-size: 12px; font-weight: 600; outline: none; }
        .new-btn { background: var(--grad); color: #fff; border: none; box-shadow: 0 4px 15px rgba(236, 72, 153, 0.35); }
        .menu-btn { background: rgba(56, 189, 248, 0.18); border-color: rgba(56, 189, 248, 0.5); }
        .voice-btn { background: rgba(168, 85, 247, 0.18); border-color: rgba(168, 85, 247, 0.5); }
        .menu-panel { display: none; position: fixed; top: 62px; right: 16px; width: min(440px, calc(100vw - 32px)); background: var(--bg); backdrop-filter: blur(22px); border: 1px solid var(--border); border-radius: 22px; padding: 14px; z-index: 40; box-shadow: 0 18px 45px rgba(0, 0, 0, 0.45); }
        .menu-panel.open { display: block; animation: pop 0.2s ease-out; }
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .menu-card { text-align: left; background: var(--glass); border: 1px solid var(--border); color: var(--text); padding: 10px 12px; border-radius: 14px; cursor: pointer; transition: 0.2s; }
        .menu-card:hover, .menu-card.active { border-color: #ec4899; background: rgba(236, 72, 153, 0.18); transform: translateY(-1px); }
        .menu-card b { display: block; font-size: 13px; margin-bottom: 2px; }
        .menu-card span { font-size: 11px; color: var(--muted); display: block; }
        .clear-all-btn { background: rgba(244, 63, 94, 0.16); color: #fb7185; border: 1px solid rgba(244, 63, 94, 0.4); padding: 5px 11px; border-radius: 999px; font-size: 12px; font-weight: 600; cursor: pointer; }
        .clear-all-btn:hover { background: #f43f5e; color: #fff; }
        .messages { flex: 1; padding: 18px 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; max-width: 820px; width: 100%; margin: 0 auto; }
        .msg { max-width: 86%; padding: 13px 17px; border-radius: 20px; line-height: 1.55; font-size: 15px; word-wrap: break-word; animation: pop 0.25s ease-out; }
        @keyframes pop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .user { background: var(--grad); color: #fff; align-self: flex-end; border-bottom-right-radius: 6px; white-space: pre-wrap; box-shadow: 0 6px 20px rgba(99, 102, 241, 0.3); }
        .user img { max-width: 220px; max-height: 220px; border-radius: 12px; display: block; margin-bottom: 8px; }
        .bot { background: var(--glass); backdrop-filter: blur(14px); border: 1px solid var(--border); align-self: flex-start; border-bottom-left-radius: 6px; box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08); }
        .quiz-grid { display: flex; flex-direction: column; gap: 7px; margin-top: 10px; }
        .quiz-opt { text-align: left; background: rgba(139, 92, 246, 0.14); border: 1px solid var(--border); color: var(--text); padding: 9px 14px; border-radius: 12px; cursor: pointer; font-size: 13px; font-weight: 600; transition: 0.2s; }
        .quiz-opt:hover:not(:disabled) { border-color: #38bdf8; transform: translateX(4px); }
        .quiz-opt.ok { background: rgba(16, 185, 129, 0.25); border-color: #10b981; color: #10b981; }
        .quiz-opt.err { background: rgba(244, 63, 94, 0.25); border-color: #f43f5e; color: #f43f5e; }
        .msg-actions { display: flex; gap: 6px; margin-top: 9px; }
        .act-btn { background: rgba(139, 92, 246, 0.16); color: var(--muted); border: 1px solid var(--border); padding: 4px 10px; border-radius: 999px; font-size: 12px; cursor: pointer; }
        .bottom-bar { background: var(--glass); backdrop-filter: blur(18px); border-top: 1px solid var(--border); padding: 10px 0 14px; display: flex; flex-direction: column; align-items: center; gap: 8px; overflow: hidden; }
        .marquee { width: 100%; max-width: 820px; overflow: hidden; }
        .marquee-track { display: flex; gap: 8px; width: max-content; animation: scrollLeft 38s linear infinite; }
        .marquee:hover .marquee-track { animation-play-state: paused; }
        @keyframes scrollLeft { 0% { transform: translateX(0); } 100% { transform: translateX(-33.333%); } }
        .chip { white-space: nowrap; background: rgba(139, 92, 246, 0.16); border: 1px solid var(--border); color: var(--text); padding: 5px 13px; border-radius: 999px; font-size: 12px; cursor: pointer; }
        .chip:hover { background: var(--grad); color: #fff; }
        .preview-bar { display: none; width: 100%; max-width: 820px; padding: 0 16px; align-items: center; gap: 10px; }
        .preview-chip { display: inline-flex; align-items: center; gap: 8px; background: rgba(139, 92, 246, 0.22); border: 1px solid var(--border); padding: 5px 12px; border-radius: 14px; font-size: 12px; }
        .preview-chip img { width: 34px; height: 34px; object-fit: cover; border-radius: 8px; }
        .input-wrap { width: 100%; padding: 0 16px; display: flex; justify-content: center; }
        .input-box { width: 100%; max-width: 820px; display: flex; gap: 5px; background: rgba(139, 92, 246, 0.1); border: 1px solid var(--border); padding: 5px; border-radius: 999px; align-items: center; }
        .input-box input[type="text"] { flex: 1; background: transparent; border: none; color: var(--text); padding: 9px 10px; font-size: 15px; outline: none; min-width: 0; }
        .icon-btn { background: rgba(139, 92, 246, 0.16); color: var(--text); border: none; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-size: 14px; flex-shrink: 0; }
        .icon-btn.recording { background: #ef4444; color: #fff; }
        .send-btn { background: var(--grad); color: #fff; border: none; width: 38px; height: 38px; border-radius: 50%; font-weight: 700; cursor: pointer; font-size: 16px; flex-shrink: 0; }
        .send-btn:disabled { opacity: 0.4; }
        .modal-bg { display: none; position: fixed; inset: 0; background: rgba(3, 4, 11, 0.65); justify-content: center; align-items: center; padding: 14px; z-index: 50; }
        .modal { background: var(--bg); border: 1px solid var(--border); width: 100%; max-width: 520px; max-height: 80vh; border-radius: 24px; display: flex; flex-direction: column; overflow: hidden; }
        .modal-head { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .modal-search { padding: 12px 16px; }
        .modal-search input { width: 100%; padding: 10px 16px; background: rgba(139, 92, 246, 0.12); border: 1px solid var(--border); color: var(--text); border-radius: 999px; }
        .hist-list { padding: 8px 16px 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .hist-item { background: var(--glass); border: 1px solid var(--border); padding: 12px 15px; border-radius: 16px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .hist-info { flex: 1; cursor: pointer; overflow: hidden; }
        .hist-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .hist-sub { font-size: 12px; color: var(--muted); }
        .del-btn { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 16px; padding: 4px 8px; }
    </style>
</head>
<body>
<canvas id="spaceCanvas"></canvas>
<div class="nebula n1"></div>
<div class="nebula n2"></div>
<div class="nebula n3"></div>
<div class="header">
    <div class="brand-wrap"><div class="brand">✦ AETHER</div><span class="stat-badge" id="statBadge">⚡ 0</span></div>
    <div class="controls">
        <button class="pill-btn new-btn" onclick="startNewChat()">+ Чат</button>
        <button class="pill-btn" onclick="openHistory()">История</button>
        <button class="pill-btn" onclick="exportChat()" title="Скачать конспект">📥</button>
        <button class="pill-btn" id="themeBtn" onclick="toggleTheme()">☀️</button>
        <button class="pill-btn voice-btn" id="voiceBtn" onclick="togglePanel('voicePanel')">🗣️ Голос: 👩 Ассистент</button>
        <button class="pill-btn menu-btn" id="menuBtn" onclick="togglePanel('menuPanel')">☰ Меню: ✦ Ассистент</button>
    </div>
</div>
<div class="menu-panel" id="voicePanel">
    <div class="menu-grid" id="voiceGrid"></div>
</div>
<div class="menu-panel" id="menuPanel">
    <div class="menu-grid" id="menuGrid"></div>
</div>
<div class="messages" id="chatBox">
    <div class="msg bot">Добро пожаловать в <b>AETHER</b> ✦ Выбирай режим в <b>☰ Меню</b>, тембр озвучки в <b>🗣️ Голос</b> или загружай фото (📷) внизу!</div>
</div>
<div class="bottom-bar">
    <div class="marquee"><div class="marquee-track" id="marqueeTrack"></div></div>
    <div class="preview-bar" id="previewBar">
        <div class="preview-chip">
            <img id="previewImg" src="">
            <span>Фото прикреплено</span>
            <button class="del-btn" onclick="clearImage()" title="Убрать фото">✕</button>
        </div>
    </div>
    <div class="input-wrap">
        <div class="input-box">
            <input type="file" id="imgInput" accept="image/*" style="display:none" onchange="handleImageUpload(event)">
            <input type="text" id="userInput" placeholder="Задай вопрос, надиктуй или загрузи фото (📷)..." onkeydown="if(event.key==='Enter') sendMessage()">
            <button class="icon-btn" onclick="magicPrompt()" title="Улучшить запрос (🪄)">🪄</button>
            <button class="icon-btn" onclick="document.getElementById('imgInput').click()" title="Загрузить фото">📷</button>
            <button class="icon-btn" id="micBtn" onclick="toggleVoice()" title="Голосовой ввод">🎙️</button>
            <button class="send-btn" id="sendBtn" onclick="sendMessage()">↑</button>
        </div>
    </div>
</div>
<div class="modal-bg" id="historyModal" onclick="if(event.target===this) closeHistory()">
    <div class="modal">
        <div class="modal-head">
            <h3>История запросов</h3>
            <div style="display:flex;gap:8px;align-items:center;">
                <button class="clear-all-btn" onclick="clearAllHistory()">🗑️ Очистить всё</button>
                <button class="del-btn" onclick="closeHistory()">✕</button>
            </div>
        </div>
        <div class="modal-search"><input type="text" id="historySearch" placeholder="Найти запрос..." oninput="filterHistory()"></div>
        <div class="hist-list" id="historyList"></div>
    </div>
</div>
<script>
    const cvs = document.getElementById("spaceCanvas"), ctx = cvs.getContext("2d");
    let stars = Array.of(), solar = Array.of(), clouds = Array.of(), meteor = null, mouse = {x: -999, y: -999}, warpSpeed = 1, t3d = 0, isDay = false;
    function toggleTheme() {
        isDay = !isDay;
        document.body.classList.toggle("light", isDay);
        document.documentElement.classList.toggle("light", isDay);
        document.getElementById("themeBtn").textContent = isDay ? "🌙" : "☀️";
    }
    window.addEventListener("mousemove", e => { mouse.x = e.clientX; mouse.y = e.clientY; });
    window.addEventListener("touchmove", e => { const t = e.touches && e.touches.item(0); if(t) { mouse.x = t.clientX; mouse.y = t.clientY; } });
    function initSpace() {
        cvs.width = window.innerWidth; cvs.height = window.innerHeight;
        const starColors = Array.of("255,255,255", "192,132,252", "56,189,248", "244,114,182");
        stars = Array.from({length: 110}, () => ({x: Math.random()*cvs.width, y: Math.random()*cvs.height, r: Math.random()*1.7+0.5, s: Math.random()*0.3+0.08, a: Math.random(), c: starColors.at(Math.floor(Math.random()*starColors.length))}));
        const base = Math.min(cvs.width, cvs.height) * 0.48;
        solar = Array.of(
            {dist: base*0.18, r: 5.5, speed: 0.017, ang: 0.4, tilt: 0.12, c1: "#f1f5f9", c2: "#64748b", c3: "#0f172a"},
            {dist: base*0.27, r: 8.5, speed: 0.013, ang: 2.1, tilt: 0.06, c1: "#fef08a", c2: "#d97706", c3: "#451a03"},
            {dist: base*0.37, r: 10.5, speed: 0.01, ang: 4.0, tilt: 0.04, c1: "#7dd3fc", c2: "#0284c7", c3: "#064e3b", moon: true, earth: true},
            {dist: base*0.47, r: 7.5, speed: 0.0082, ang: 1.2, tilt: 0.08, c1: "#fda4af", c2: "#dc2626", c3: "#450a0a"},
            {dist: base*0.62, r: 22, speed: 0.0055, ang: 5.1, tilt: 0.03, c1: "#fed7aa", c2: "#c2410c", c3: "#431407", bands: true},
            {dist: base*0.77, r: 18.5, speed: 0.0042, ang: 2.8, tilt: 0.09, c1: "#fde68a", c2: "#b45309", c3: "#451a03", ring: true, bands: true},
            {dist: base*0.91, r: 13.5, speed: 0.0031, ang: 0.9, tilt: 0.05, c1: "#a5f3fc", c2: "#06b6d4", c3: "#164e63", ring: true},
            {dist: base*1.03, r: 13, speed: 0.0024, ang: 3.6, tilt: 0.07, c1: "#93c5fd", c2: "#1d4ed8", c3: "#172554"}
        );
        clouds = Array.from({length: 9}, (_, i) => { const z = 0.45 + (i % 3) * 0.35; return {x: (cvs.width / 7) * i, y: cvs.height * (0.1 + (i % 4) * 0.13), z: z, s: 0.18 * z, sc: 0.65 * z}; });
    }
    function drawSun3D(cx, cy) {
        const pulse = 1 + Math.sin(t3d * 2.5) * 0.04, corona = ctx.createRadialGradient(cx, cy, 10, cx, cy, 62 * pulse);
        corona.addColorStop(0, "rgba(254, 249, 195, 1)"); corona.addColorStop(0.3, "rgba(251, 191, 36, 0.65)"); corona.addColorStop(0.65, "rgba(234, 88, 12, 0.18)"); corona.addColorStop(1, "rgba(234, 88, 12, 0)");
        ctx.fillStyle = corona; ctx.beginPath(); ctx.arc(cx, cy, 62 * pulse, 0, Math.PI * 2); ctx.fill();
        const core = ctx.createRadialGradient(cx - 5, cy - 5, 2, cx, cy, 24); core.addColorStop(0, "#ffffff"); core.addColorStop(0.6, "#fde047"); core.addColorStop(1, "#ea580c");
        ctx.fillStyle = core; ctx.beginPath(); ctx.arc(cx, cy, 24, 0, Math.PI * 2); ctx.fill();
    }
    function drawPlanet3D(obj) {
        const p = obj.p, px = obj.x, py = obj.y, r = p.r * obj.scale, lx = -Math.cos(p.ang) * r * 0.42, ly = -Math.sin(p.ang) * r * 0.25;
        ctx.save();
        if (p.ring) { ctx.strokeStyle = "rgba(253, 230, 138, 0.42)"; ctx.lineWidth = 4 * obj.scale; ctx.beginPath(); ctx.ellipse(px, py, r * 2.25, r * 0.58, -0.32, Math.PI, Math.PI * 2); ctx.stroke(); }
        ctx.save(); ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI * 2); ctx.clip();
        const g = ctx.createRadialGradient(px + lx, py + ly, r * 0.08, px, py, r * 1.25); g.addColorStop(0, p.c1); g.addColorStop(0.55, p.c2); g.addColorStop(1, p.c3);
        ctx.fillStyle = g; ctx.fillRect(px - r, py - r, r * 2, r * 2);
        if (p.earth) { ctx.fillStyle = "rgba(34, 197, 94, 0.45)"; const spin = (t3d * 18) % (r * 2); ctx.beginPath(); ctx.arc(px - r + spin, py - r * 0.2, r * 0.45, 0, Math.PI * 2); ctx.arc(px - r + spin + r * 0.9, py + r * 0.25, r * 0.35, 0, Math.PI * 2); ctx.fill(); }
        if (p.bands) { ctx.strokeStyle = "rgba(255,255,255,0.18)"; ctx.lineWidth = 2.2 * obj.scale; for (let b = -2; b <= 2; b++) { const sh = Math.sin(t3d * 2 + b) * 3; ctx.beginPath(); ctx.ellipse(px + sh, py + b * (r * 0.28), r * 0.96, r * 0.13, -0.2, 0, Math.PI * 2); ctx.stroke(); } }
        const shadow = ctx.createRadialGradient(px - lx * 1.4, py - ly * 1.4, r * 0.15, px, py, r * 1.15); shadow.addColorStop(0, "rgba(2, 6, 23, 0.72)"); shadow.addColorStop(1, "rgba(2, 6, 23, 0)");
        ctx.fillStyle = shadow; ctx.fillRect(px - r, py - r, r * 2, r * 2); ctx.restore();
        if (p.ring) { ctx.strokeStyle = "rgba(253, 230, 138, 0.78)"; ctx.lineWidth = 4 * obj.scale; ctx.beginPath(); ctx.ellipse(px, py, r * 2.25, r * 0.58, -0.32, 0, Math.PI); ctx.stroke(); }
        if (p.moon) { const ma = t3d * 3.8, mx = px + Math.cos(ma) * (r * 1.8), my = py + Math.sin(ma) * (r * 0.65); ctx.fillStyle = "#f1f5f9"; ctx.beginPath(); ctx.arc(mx, my, 2.8 * obj.scale, 0, Math.PI * 2); ctx.fill(); }
        ctx.restore();
    }
    function drawDaySky() {
        const ox = mouse.x > 0 ? (mouse.x - cvs.width / 2) : 0, oy = mouse.y > 0 ? (mouse.y - cvs.height / 2) : 0;
        const sx = cvs.width * 0.83 - ox * 0.015, sy = cvs.height * 0.16 - oy * 0.015, pulse = 1 + Math.sin(t3d * 2) * 0.04;
        ctx.save(); ctx.translate(sx, sy); ctx.rotate(t3d * 0.15);
        for (let r = 0; r < 12; r++) { ctx.rotate(Math.PI / 6); const rg = ctx.createLinearGradient(0, 0, 0, 190 * pulse); rg.addColorStop(0, "rgba(254, 240, 138, 0.25)"); rg.addColorStop(1, "rgba(254, 240, 138, 0)"); ctx.fillStyle = rg; ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(10, 0); ctx.lineTo(28, 190 * pulse); ctx.lineTo(-28, 190 * pulse); ctx.closePath(); ctx.fill(); }
        ctx.restore();
        const glow = ctx.createRadialGradient(sx, sy, 16, sx, sy, 185 * pulse); glow.addColorStop(0, "rgba(255, 255, 255, 1)"); glow.addColorStop(0.22, "rgba(254, 240, 138, 0.85)"); glow.addColorStop(0.55, "rgba(251, 191, 36, 0.25)"); glow.addColorStop(1, "rgba(251, 191, 36, 0)");
        ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(sx, sy, 185 * pulse, 0, Math.PI * 2); ctx.fill();
        const sun3d = ctx.createRadialGradient(sx - 10, sy - 10, 4, sx, sy, 38); sun3d.addColorStop(0, "#ffffff"); sun3d.addColorStop(0.7, "#fef08a"); sun3d.addColorStop(1, "#f59e0b");
        ctx.fillStyle = sun3d; ctx.beginPath(); ctx.arc(sx, sy, 38, 0, Math.PI * 2); ctx.fill();
        clouds.forEach(cl => {
            cl.x += cl.s; if (cl.x > cvs.width + 160) cl.x = -160;
            const cx = cl.x - ox * (0.04 * cl.z), cy = cl.y - oy * (0.04 * cl.z); ctx.save(); ctx.translate(cx, cy); ctx.scale(cl.sc, cl.sc);
            Array.of({x: -28, y: 10, r: 24}, {x: 0, y: 0, r: 32}, {x: 32, y: -10, r: 40}, {x: 68, y: -2, r: 33}, {x: 96, y: 10, r: 24}).forEach(pf => {
                const cg = ctx.createRadialGradient(pf.x - pf.r * 0.25, pf.y - pf.r * 0.35, pf.r * 0.1, pf.x, pf.y + pf.r * 0.15, pf.r * 1.15);
                cg.addColorStop(0, "rgba(255, 255, 255, 0.96)"); cg.addColorStop(0.7, "rgba(240, 249, 255, 0.88)"); cg.addColorStop(1, "rgba(186, 230, 253, 0.78)");
                ctx.fillStyle = cg; ctx.beginPath(); ctx.arc(pf.x, pf.y, pf.r, 0, Math.PI * 2); ctx.fill();
            });
            ctx.restore();
        });

            opts.forEach(line => { const btn = document.createElement("button"); btn.className = "quiz-opt"; btn.textContent = line.trim(); const l0 = line.trim().charAt(0).toUpperCase(), letter = Reflect.get(mapRu, l0) || l0; btn.onclick = () => { grid.querySelectorAll("button").forEach(b => b.disabled = true); if (letter === correct) { btn.classList.add("ok"); info.innerHTML = "✅ <b>Верно!</b> " + fmt(expText); } else { btn.classList.add("err"); grid.querySelectorAll("button").forEach(b => { const bl = b.textContent.trim().charAt(0).toUpperCase(); if((Reflect.get(mapRu, bl)||bl)===correct) b.classList.add("ok"); }); info.innerHTML = "❌ <b>Ошибка.</b> Правильный ответ: <b>" + correct + "</b>. " + fmt(expText); } info.style.display = "block"; }; grid.appendChild(btn); });
            div.appendChild(grid); div.appendChild(info);
        } else { div.innerHTML = fmt(rawText); }
    }
    function addActionBtns(div, rawText) { const wrap = document.createElement("div"); wrap.className = "msg-actions"; const copy = document.createElement("button"); copy.className = "act-btn"; copy.textContent = "📋 Копировать"; copy.onclick = () => { navigator.clipboard.writeText(rawText); copy.textContent = "✓ Готово"; setTimeout(() => copy.textContent = "📋 Копировать", 1500); }; const speak = document.createElement("button"); speak.className = "act-btn"; speak.textContent = "🔊 Озвучить"; speak.onclick = () => { if (activeSpeakBtn === speak) { stopSpeech(); return; } stopSpeech(); const u = new SpeechSynthesisUtterance(rawText.replace(/[#*`]/g, "")); u.lang = "ru-RU"; const vc = Reflect.get(voicesData, currentVoice) || voicesData.std; u.pitch = vc.pitch; u.rate = vc.rate; activeSpeakBtn = speak; speak.textContent = "⏹ Стоп"; u.onend = () => { if (activeSpeakBtn === speak) stopSpeech(); }; u.onerror = () => { if (activeSpeakBtn === speak) stopSpeech(); }; window.speechSynthesis.speak(u); }; wrap.appendChild(copy); wrap.appendChild(speak); div.appendChild(wrap); }
    function exportChat() { const msgs = Array.from(document.querySelectorAll("#chatBox .msg")).map(m => (m.classList.contains("user") ? "Вы: " : "Aether: ") + m.innerText.replace(/📋 Копировать|🔊 Озвучить|⏹ Стоп|✓ Готово/g, "").trim()); const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(Array.of(msgs.join("\n\n---\n\n")), {type: "text/plain;charset=utf-8"})); a.download = "Aether_dialog.txt"; a.click(); }
    function toggleVoice() { const SR = window.SpeechRecognition || window.webkitSpeechRecognition; if (!SR) return alert("Голосовой ввод не поддерживается"); stopSpeech(); const rec = new SR(); rec.lang = "ru-RU"; const btn = document.getElementById("micBtn"); btn.classList.add("recording"); rec.onresult = e => { const r = e.results.item(0).item(0); document.getElementById("userInput").value = r.transcript; sendMessage(); }; rec.onend = () => btn.classList.remove("recording"); rec.start(); }
    async function selectChat(id) { stopSpeech(); currentChatId = id; closeHistory(); const res = await fetch("/chats/" + id + "/messages"), msgs = await res.json(), box = document.getElementById("chatBox"); box.innerHTML = ""; msgs.forEach(m => addMsg(m.content, m.role === "user" ? "user" : "bot", m.role !== "user")); }
    function startNewChat() { stopSpeech(); currentChatId = null; clearImage(); document.getElementById("chatBox").innerHTML = '<div class="msg bot">Новая орбита открыта ✦ Нажми <b>☰ Меню</b> вверху или загрузи фото (📷) внизу!</div>'; buildMarquee(); }
    async function deleteMessage(msgId, e) { e.stopPropagation(); await fetch("/messages/" + msgId, {method: "DELETE"}); openHistory(); updateStat(); }
    async function clearAllHistory() { if (!confirm("Точно удалить всю историю запросов?")) return; await fetch("/history/clear", {method: "DELETE"}); currentChatId = null; allHistory = Array.of(); renderHistory(Array.of()); updateStat(); }
    async function openHistory() { document.getElementById("historyModal").style.display = "flex"; document.getElementById("historySearch").value = ""; const res = await fetch("/history"); allHistory = await res.json(); renderHistory(allHistory); }
    function closeHistory() { document.getElementById("historyModal").style.display = "none"; }
    function renderHistory(items) { const list = document.getElementById("historyList"); list.innerHTML = items.length ? "" : "<div style='color:var(--muted);text-align:center;padding:24px'>В космосе пока тихо</div>"; items.forEach(i => { const d = document.createElement("div"); d.className = "hist-item" + (i.chat_id === currentChatId ? " active" : ""); d.innerHTML = '<div class="hist-info" onclick="selectChat(' + i.chat_id + ')"><div class="hist-title">' + i.question + '</div><div class="hist-sub">' + i.time + '</div></div><button class="del-btn" onclick="deleteMessage(' + i.id + ', event)">✕</button>'; list.appendChild(d); }); }
    function filterHistory() { const q = document.getElementById("historySearch").value.toLowerCase(); renderHistory(allHistory.filter(i => i.question.toLowerCase().includes(q))); }
    async function sendMessage() { const inp = document.getElementById("userInput"), btn = document.getElementById("sendBtn"), text = inp.value.trim(); if (!text && !attachedImage) return; stopSpeech(); const imgToSend = attachedImage, cfg = Reflect.get(rolesData, currentRole) || rolesData.assistant; addMsg(text || "Проверь и реши задание с фото", "user", false, imgToSend); inp.value = ""; clearImage(); btn.disabled = true; warpSpeed = 14; const load = addMsg(imgToSend ? "Распознаю фото и решаю..." : "Гиперпрыжок через эфир...", "bot", false); try { const r = await fetch("/ask", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({chat_id: currentChatId, message: text, image: imgToSend, role: cfg.prompt})}); const d = await r.json(); renderQuizOrText(load, d.reply); addActionBtns(load, d.reply); if (!currentChatId && d.chat_id) currentChatId = d.chat_id; updateStat(); } catch (e) { load.textContent = "Потеряна связь с сервером"; } finally { warpSpeed = 1; btn.disabled = false; inp.focus(); } }
    function addMsg(t, s, withAct, imgSrc) { const box = document.getElementById("chatBox"), d = document.createElement("div"); d.className = "msg " + s; if (s === "bot") { renderQuizOrText(d, t); if (withAct) addActionBtns(d, t); } else { if (imgSrc) { const im = document.createElement("img"); im.src = imgSrc; d.appendChild(im); } d.appendChild(document.createTextNode(t)); } box.appendChild(d); box.scrollTop = box.scrollHeight; return d; }
</script>
